name: Node.js CI

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          # prefer clean install; fall back to npm install to refresh lockfile when out of sync
          npm ci || npm install

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Commit package-lock if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh package-lock.json [ci skip]" || true
            git push
          else
            echo "No package-lock changes"
          fi
